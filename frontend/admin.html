<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - BikerShop</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/admin.js" defer></script>
</head>
<body>

    <header class="encabezado">
        <h1>⚙️ Panel de Administración</h1>
        <p>BikerShop - Gestión de Productos e Inventario</p>
    </header>

    <div class="contenedor-principal">
        
        <!-- FORMULARIO DE CREACIÓN Y EDICIÓN -->
        <section class="seccion-productos" style="flex: 1; min-width: 320px;">
            <div class="barra-filtros">
                <h2 id="titulo-form">➕ Agregar Nuevo Producto</h2>
            </div>

            <form id="form-producto" class="formulario-admin" style="background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
                <input type="hidden" id="prod-id">

                <div class="grupo-form">
                    <label for="prod-nombre">Nombre del Producto:</label>
                    <input type="text" id="prod-nombre" placeholder="Ej. Asiento Confort Rojo" required>
                </div>

                <div class="grupo-form">
                    <label for="prod-precio">Precio ($):</label>
                    <input type="number" id="prod-precio" step="0.01" placeholder="Ej. 25.00" required>
                </div>

                <!-- CATEGORÍA (Modelo de moto o marca) -->
                <div class="grupo-form">
                    <label for="prod-categoria">Categoría (Modelo / Marca):</label>
                    <input type="text" id="prod-categoria" placeholder="Ej. AX100, CG125, DT125" required>
                </div>

                <!-- SUBCATEGORÍA (Tipo de repuesto/accesorio) -->
                <div class="grupo-form">
                    <label for="prod-subcategoria">Subcategoría (Tipo de repuesto):</label>
                    <input type="text" id="prod-subcategoria" placeholder="Ej. Asientos, Frenos, Luces" required>
                </div>

                <div class="grupo-form">
                    <label for="prod-imagen">Imagen del Producto (URL o Archivo):</label>
                    <input type="text" id="prod-imagen-url" placeholder="URL de la imagen (opcional)" style="margin-bottom: 8px;">
                    <input type="file" id="prod-imagen-file" accept="image/*">
                </div>

                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button type="submit" id="btn-guardar" class="btn-accion">Guardar Producto</button>
                    <button type="button" id="btn-cancelar" class="btn-eliminar" style="display: none;" onclick="resetearFormulario()">Cancelar Edición</button>
                </div>
            </form>
        </section>

        <!-- LISTA DE PRODUCTOS REGISTRADOS -->
        <aside class="seccion-carrito" style="flex: 1.5; min-width: 340px;">
            <h3>📦 Inventario Actual</h3>
            
            <!-- BUSCADOR RÁPIDO EN EL ADMIN -->
            <div class="buscador-grupo" style="margin-bottom: 15px;">
                <span class="icono-lupa">🔍</span>
                <input type="text" id="input-admin-buscar" placeholder="Filtrar inventario..." oninput="filtrarInventarioAdmin()">
            </div>

            <div id="lista-admin-productos" class="lista-admin">
                <p>Cargando inventario...</p>
            </div>
        </aside>

    </div>

</body>
</html>
